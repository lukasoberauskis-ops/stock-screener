name: Run Stock Screener & Publish Live Website

on:
  schedule:
    - cron: '0 8 * * 1-5' # Runs automatically every Monday through Friday at 8:00 AM UTC
  workflow_dispatch: # Allows you to manually trigger a run anytime via the GitHub website

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas numpy yfinance requests plotly

      - name: Run screener script
        run: |
          python stock_screener_production.py

      - name: Commit and push generated index.html
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add index.html
          git commit -m "Automated screener update: $(date)" || exit 0
          git push
